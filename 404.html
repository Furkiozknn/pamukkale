<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sayfa bulunamadı · Pamukkale</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1199A4">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FAF8F3'/%3E%3Cpath d='M8 44c6-4 12-4 18 0s12 4 18 0 8-3 12-1v10H8z' fill='%231199A4'/%3E%3Cpath d='M32 9s-10 11-10 19a10 10 0 0 0 20 0C42 20 32 9 32 9z' fill='%2308666E'/%3E%3C/svg%3E">
<style>
:root{--bg:#F5F3EE;--ink:#173B44;--card:#fff;--accent:#12868C;--line:#D6C7AF}
@media (prefers-color-scheme:dark){:root{--bg:#10262B;--ink:#EAF4F4;--card:#173B44;--accent:#2EC4C9;--line:#2c5760}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(440px,100%);padding:32px 24px;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:24px}
h1{margin:0 0 8px;font-size:28px}
p{margin:0 0 20px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;margin:4px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink);font-weight:700;text-decoration:none}
a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Havuz burada değil</h1>
  <p>Aradığın sayfa bulunamadı. · This page does not exist.</p>
  <a class="btn primary" href="https://furkiozknn.github.io/pamukkale/">Pamukkale'yi oyna</a>
  <a class="btn" href="https://furkiozknn.github.io/">Diğer oyunlar · More games</a>
</main>
</body>
</html>
